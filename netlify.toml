# This site lives under /quiz/ — the same path it answers on at the short
# domain (https://<short-domain>/quiz/). Vite builds into build/quiz and
# `publish` stays at build/, so public URLs and origin URLs match exactly and
# the Cloudflare worker never has to rewrite a path.

[build]
  command = "npm run build"
  publish = "build"

# "/quiz" with no trailing slash would otherwise hit the catch-all below and
# be rewritten to "/quiz/quiz".
[[redirects]]
  from = "/quiz"
  to = "/quiz/"
  status = 301

# SPA fallback, scoped to the sub-path. Existing files win over this rule, so
# hashed assets under /quiz/assets/ are still served as files.
[[redirects]]
  from = "/quiz/*"
  to = "/quiz/index.html"
  status = 200

# Anything left at the root — including a bare visit to the .netlify.app
# host — is sent to the app's real home.
[[redirects]]
  from = "/*"
  to = "/quiz/:splat"
  status = 301
  force = true
